[tool.poetry]
name = "enterprise-ai-sdlc"
version = "0.1.0"
description = "Multi-Agent SDLC Platform"
authors = ["Hamza Abbas", "Hania Zahra", "Muhammad Abdullah"]

[tool.poetry.dependencies]
python = "^3.11"

[tool.black]
line-length = 88
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

